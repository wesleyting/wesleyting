<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrandAppart Sticky Cards | Codegrid</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap");

:root {
  --base-1: #3d2fa9;
  --base-2: #ff7722;
  --base-3: #ff3d33;
  --base-4: #785f47;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

h1 {
  text-transform: uppercase;
  font-family: "Barlow Condensed", sans-serif;
  font-size: 3rem;
  font-weight: 800;
  line-height: 1;
}

p {
  text-transform: uppercase;
  font-family: "DM Mono", monospace;
  font-size: 0.9rem;
}

section {
  position: relative;
  width: 100%;
  height: 100svh;
  overflow: hidden;
}

.intro,
.outro {
  display: flex;
  justify-content: center;
  align-items: center;
}

.sticky-cards {
  background-color: #e3e3db;
  perspective: 1000px;
}

.sticky-cards .card {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 65%;
  height: 60%;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1rem;
  padding: 2.5rem;
  border-radius: 1rem;
  color: #fff;
  transform-origin: center bottom;
  will-change: transform;
}

.card .col {
  flex: 1;
  height: 100%;
}

.card .col:nth-child(1) {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 0.5rem;
}

.card .col:nth-child(2) {
  border-radius: 0.75rem;
  overflow: hidden;
}

.card#card-1 {
  background-color: var(--base-1);
  z-index: 5;
}

.card#card-2 {
  background-color: var(--base-2);
  z-index: 4;
}

.card#card-3 {
  background-color: var(--base-3);
  z-index: 3;
}

.card#card-4 {
  background-color: var(--base-4);
  z-index: 2;
}

@media (max-width: 1000px) {
  .sticky-cards .card {
    width: calc(100% - 4rem);
    height: 75%;
    flex-direction: column;
  }

  .card .col {
    width: 100%;
  }
}

    </style>
  </head>
  <body>
    <section class="intro">
      <h1>Enter the Frame</h1>
    </section>

    <section class="sticky-cards">
      <div class="card" id="card-1">
        <div class="col">
          <p>Quiet Control</p>
          <h1>Signal Drift</h1>
        </div>
        <div class="col">
          <img src="/card-img-1.jpg" alt="" />
        </div>
      </div>
      <div class="card" id="card-2">
        <div class="col">
          <p>Fluid Structures</p>
          <h1>Skyline Drift</h1>
        </div>
        <div class="col">
          <img src="/card-img-2.jpg" alt="" />
        </div>
      </div>
      <div class="card" id="card-3">
        <div class="col">
          <p>Wired Thought</p>
          <h1>Neural Assembly</h1>
        </div>
        <div class="col">
          <img src="/card-img-3.jpg" alt="" />
        </div>
      </div>
      <div class="card" id="card-4">
        <div class="col">
          <p>Silent Repetition</p>
          <h1>Learning Loop</h1>
        </div>
        <div class="col">
          <img src="/card-img-4.jpg" alt="" />
        </div>
      </div>
    </section>

    <section class="outro">
      <h1>Loop Complete</h1>
    </section>
    <script type="module" src="/script.js"></script>
    <script>import gsap from "gsap";
import { ScrollTrigger } from "gsap/ScrollTrigger";
import Lenis from "lenis";

gsap.registerPlugin(ScrollTrigger);

document.addEventListener("DOMContentLoaded", () => {
  const lenis = new Lenis();
  lenis.on("scroll", ScrollTrigger.update);
  gsap.ticker.add((time) => {
    lenis.raf(time * 1000);
  });
  gsap.ticker.lagSmoothing(0);

  const cards = document.querySelectorAll(".sticky-cards .card");
  const totalCards = cards.length;
  const segmentSize = 1 / totalCards;

  const cardYOffset = 5;
  const cardScaleStep = 0.075;

  cards.forEach((card, i) => {
    gsap.set(card, {
      xPercent: -50,
      yPercent: -50 + i * cardYOffset,
      scale: 1 - i * cardScaleStep,
    });
  });

  ScrollTrigger.create({
    trigger: ".sticky-cards",
    start: "top top",
    end: `+=${window.innerHeight * 8}px`,
    pin: true,
    pinSpacing: true,
    scrub: 1,
    onUpdate: (self) => {
      const progress = self.progress;

      const activeIndex = Math.min(
        Math.floor(progress / segmentSize),
        totalCards - 1,
      );
      const segProgress = (progress - activeIndex * segmentSize) / segmentSize;

      cards.forEach((card, i) => {
        if (i < activeIndex) {
          gsap.set(card, {
            yPercent: -250,
            rotationX: 35,
          });
        } else if (i === activeIndex) {
          gsap.set(card, {
            yPercent: gsap.utils.interpolate(-50, -200, segProgress),
            rotationX: gsap.utils.interpolate(0, 35, segProgress),
            scale: 1,
          });
        } else {
          const behindIndex = i - activeIndex;
          const currentYOffset = (behindIndex - segProgress) * cardYOffset;
          const currentScale = 1 - (behindIndex - segProgress) * cardScaleStep;

          gsap.set(card, {
            yPercent: -50 + currentYOffset,
            rotationX: 0,
            scale: currentScale,
          });
        }
      });
    },
  });
});
</script>
  </body>
</html>
