<!doctype html>
<html lang="en" data-native-scroll>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }
      if (!window.location.hash) {
        const resetProjectScroll = () => {
          window.scrollTo(0, 0);
          requestAnimationFrame(() => window.scrollTo(0, 0));
          setTimeout(() => window.scrollTo(0, 0), 80);
        };
        resetProjectScroll();
        window.addEventListener("DOMContentLoaded", resetProjectScroll, { once: true });
        window.addEventListener("load", resetProjectScroll, { once: true });
        window.addEventListener("pageshow", resetProjectScroll, { once: true });
      }
      if (sessionStorage.getItem("page-transition-pending") === "true") {
        document.documentElement.dataset.pageTransition = "pending";
      }
    </script>
    <title>Clearbooks Tech | Wesley Ting</title>
    <meta name="description" content="Clearbooks Tech project page by Wesley Ting." />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="stylesheet" href="/src/styles/base/global.css" />
    <link rel="stylesheet" href="/src/styles/components/page-transition.css" />
    <link rel="stylesheet" href="/src/styles/components/site-menu.css" />
    <link rel="stylesheet" href="/src/styles/pages/project.css" />
  </head>

      <div class="menu-toggle-btn"><div class="menu-toggle-btn-wrapper"><p>Menu</p></div></div>
    </nav>

    <div class="nav-overlay">
      <div class="nav-items">
        <div class="nav-item"><a href="/">Home</a></div>
        <div class="nav-item active"><a href="/#selected-work">Work</a></div>
